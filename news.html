<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ostrich | News</title>
    <link rel="icon" type="image/jpeg" href="./images/ostrich.jpg">
    <link rel="stylesheet" href="./style_text.css">
    <link rel="stylesheet" href="./mobile.css">
</head>
<body>
<script>try{if(localStorage.getItem('ostrich-theme')==='light'){document.body.classList.add('theme-light');document.body.dataset.theme='light';}}catch(e){}</script>
    <header>
        <a href="./index.html" class="home-link">Home</a>
        <div class="header-actions">
            <button type="button" class="theme-btn" aria-label="Switch to light theme">
            <svg class="theme-btn-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a6.6 6.6 0 0 0 9.9 9.9z"/></svg>
            <svg class="theme-btn-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
        </button>
            <button class="burger-menu" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <nav class="menu" id="main-menu">
            <a href="faq.html">FAQ</a>
            <a href="help.html">Support</a>
            <a href="news.html" aria-current="page">News</a>
            <a href="ideas.html">Ideas</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="news-hero">
            <span class="eyebrow">Latest updates</span>
            <h1>News</h1>
            <p>
                Follow the freshest updates, improvements, and announcements from the Ostrich team.
            </p>
        </section>

        <section class="news" aria-label="Latest news">
            <div class="news-grid">
                <article class="news-card">
                    <span class="meta">18 Sep 2026</span>
                    <h3>Creating a new, fully anonymous messenger</h3>
                    <p>A website was created for using our messenger.</p>
                </article>

            </div>
        </section>
    </main>

    <footer>
        © 2026 Ostrich Messenger. All rights reserved.
    </footer>

    <script src="./icone.js" defer></script>
</body>
</html>
